[workspace]
resolver = "2"
members = ["crates/cad-core", "crates/cad-cli"]

[workspace.package]
version = "1.12.1"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
authors = ["Caliper CAD"]
repository = "https://github.com/calipercad/caliper"
homepage = "https://calipercad.github.io/caliper/"
readme = "README.md"
keywords = ["cad", "geometry", "cnc", "laser", "3d-printing"]
categories = ["command-line-utilities", "graphics", "mathematics"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
